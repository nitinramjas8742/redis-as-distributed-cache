# ===================================================================
# Database Configuration (PostgreSQL / Dev Services)
# ===================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/agencydb}
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:root123}

# Use 'update' so multiple instances don't drop each other's database tables on startup
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ===================================================================
# Redis Configuration (Quarkus Redis Client)
# ===================================================================
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
# quarkus.redis.password=${REDIS_PASSWORD:}
quarkus.redis.timeout=2s
quarkus.redis.max-pool-size=20

# ===================================================================
# Application Specific Cache Configuration
# ===================================================================
app.cache.agency.ttl-seconds=3600

# ===================================================================
# Logging
# ===================================================================
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
