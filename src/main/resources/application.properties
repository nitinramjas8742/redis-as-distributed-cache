# ===================================================================
# Database Configuration (PostgreSQL / Dev Services)
# ===================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/agencydb}
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:root123}

# Use 'update' so multiple instances don't drop each other's database tables on startup
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Redis version-marker TTL (bounds worst-case drift if a DEL is missed)
app.cache.agency.ttl-seconds=300

# ===================================================================
# Hibernate Second-Level (L2) Cache Configuration
# ===================================================================
# Enable Hibernate L2 Cache globally
quarkus.hibernate-orm.second-level-caching-enabled=true

# Cache provider: Quarkus uses Caffeine (local in-JVM) by default
# Entity region: caches Agency objects keyed by primary key (id)
quarkus.hibernate-orm.cache."com.example.entity.Agency".memory.object-count=5000
quarkus.hibernate-orm.cache."com.example.entity.Agency".expiration.max-idle=PT1H

# Natural ID region: caches agencyCode -> id mapping (separate region)
quarkus.hibernate-orm.cache."com.example.entity.Agency##NaturalId".memory.object-count=5000
quarkus.hibernate-orm.cache."com.example.entity.Agency##NaturalId".expiration.max-idle=PT1H

# ===================================================================
# Redis Configuration (kept as infrastructure - not used for app cache in v2)
# ===================================================================
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
quarkus.redis.timeout=2s

# ===================================================================
# Logging
# ===================================================================
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
